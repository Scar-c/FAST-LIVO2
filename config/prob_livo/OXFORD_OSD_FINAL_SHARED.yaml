# Prompt22 final Oxford Spires shared semantic profile.
#
# Authority: ori-drs/FAST-LIVO2 @ config-used-OSD
# branch HEAD: f2c9abb72f82359bcb9190e31b8faa6b6b7b9a64
# source config SHA256: 195a512df13734c69535c25ebd1bc3e033112c434796b8c2c4b5b4050c589db4
#
# The source YAML uses common/image_en and an unavailable raw-image topic.
# This profile materializes the current FAST-LIVO2 code's common/img_en key
# and the exact local bag transport topic. Both Native and Prob consume this
# same profile; the adaptation is transport-level, not an algorithm setting.
# Omitted source parameters are materialized at the defaults of the cited
# FAST-LIVO2 config-used-OSD source branch.
common:
  lid_topic: "/hesai/pandar"
  imu_topic: "/alphasense_driver_ros/imu"
  img_topic: "/alphasense_driver_ros/cam0/debayered/image/compressed"
  img_en: 1
  lidar_en: 1
  ros_driver_bug_fix: false

time_offset:
  lidar_time_offset: 0.0
  imu_time_offset: 0.0
  img_time_offset: 0.0
  exposure_time_init: 0.0

extrin_calib:
  extrinsic_T: [-2.98737408e-03, -1.62174455e-02, 8.37937008e-02]
  extrinsic_R: [-1.79010935e-02, -9.99839500e-01, 7.24771588e-04,
                9.99839311e-01, -1.79003915e-02, 9.63774848e-04,
                -9.50646466e-04, 7.41907749e-04, 9.99999273e-01]
  Rcl: [0.009769443369467168, 0.9999460020163569, 0.0035427429705001123,
        0.007671197638838445, 0.003467861351881818, -0.9999645627043141,
        -0.9999228523756403, 0.009796274248324188, -0.007636904334543504]
  Pcl: [0.00035060884033447846, -0.079574053851818,
        -0.053826061545697405]

preprocess:
  lidar_type: 5
  scan_line: 64
  timestamp_unit: 3
  blind: 1.0
  point_filter_num: 1
  filter_size_surf: 0.5
  feature_extract_enabled: false
  hilti_en: false

imu:
  imu_en: true
  imu_int_frame: 1
  acc_cov: 0.1
  gyr_cov: 0.1
  b_acc_cov: 0.0001
  b_gyr_cov: 0.0001

vio:
  max_iterations: 5
  outlier_threshold: 78
  img_point_cov: 100
  patch_size: 8
  patch_pyrimid_level: 4
  normal_en: true
  raycast_en: false
  inverse_composition_en: false
  exposure_estimate_en: true
  inv_expo_cov: 0.1

lio:
  max_iterations: 5
  dept_err: 0.05
  beam_err: 0.02
  min_eigen_value: 0.01
  voxel_size: 0.5
  max_layer: 1
  max_points_num: 50
  layer_init_num: [5, 5, 5, 5, 5]

local_map:
  map_sliding_en: false
  half_map_size: 100
  sliding_thresh: 8

uav:
  imu_rate_odom: false
  gravity_align_en: false

publish:
  dense_map_en: false
  pub_effect_point_en: false
  pub_plane_en: false
  pub_scan_num: 1
  blind_rgb_points: 0.01

evo:
  seq_name: "Oxford_Spires"
  pose_output_en: true

pcd_save:
  pcd_save_en: false
  type: 0
  colmap_output_en: false
  filter_size_pcd: 0.5
  interval: -1

image_save:
  img_save_en: false
  interval: 1
